# Gate definition: docs/quality-gates.md sections 1-9. Changes need the gate-change-approved label.
# `check` runs exactly the PR gates; long jobs (full mutation, long fuzzing, -count=5) are nightly.
version: "3"

# Keep local Go tools responsive; CI retains its runner defaults. Explicit shell
# settings win. GOMAXPROCS also sets the default test/fuzz parallelism, while
# Gremlins needs its own worker limit because it otherwise uses runtime.NumCPU.
env:
  GOMAXPROCS: '{{if env "CI"}}{{env "GOMAXPROCS"}}{{else}}{{default "2" (env "GOMAXPROCS")}}{{end}}'
  GOFLAGS: '{{if env "CI"}}{{env "GOFLAGS"}}{{else}}{{default "-p=1" (env "GOFLAGS")}}{{end}}'
  GREMLINS_UNLEASH_WORKERS: '{{if env "CI"}}{{env "GREMLINS_UNLEASH_WORKERS"}}{{else}}{{default "1" (env "GREMLINS_UNLEASH_WORKERS")}}{{end}}'

vars:
  # Priority wrapper for the heavy tasks, local machines only: the gate runs at
  # a lower CPU class (macOS) or nice level (Linux) so interactive work keeps
  # precedence while the gate still finishes. Empty under CI, so runner
  # settings are untouched, and on other platforms, which have no equivalent
  # in the base install. quality/ pins the expansion and that every heavy task
  # carries the prefix.
  HEAVY_WRAP: '{{if env "CI"}}{{else if eq OS "darwin"}}taskpolicy -c utility{{else if eq OS "linux"}}nice -n 10{{end}}'
  # Machine-wide heavy lock for the heavy tasks, local machines only: the gate
  # queues behind fuguegate exclusive, so heavy work from several worktrees
  # runs one task at a time instead of swapping the machine. Empty under CI
  # and on platforms without flock. It sits at exactly one level — on the
  # heavy tasks' own commands, never on `check`, whose composed tasks would
  # nest the same flock and deadlock. quality/ pins that too.
  HEAVY_LOCK: '{{if env "CI"}}{{else if or (eq OS "darwin") (eq OS "linux")}}go run ./cmd/fuguegate exclusive --{{end}}'
  # Exact pin. Keep in sync with .github/workflows once CI exists (F0.6); quality/lint_test.go
  # reads this value so the tests run the same linter version as `task lint`.
  GOLANGCI_LINT_VERSION: v2.15.0
  GOLANGCI_LINT: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
  ALLOWED_LICENSES: MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: Run every PR gate locally
    cmds:
      - task: fmt
      - task: lint
      - task: actions
      - task: vet
      - task: test
      - task: coverage
      - task: deadcode
      - task: mod
      - task: proto
      - task: fuzz-short
      # mutation-changed is paused (quality-gates §11); run it by hand with `task mutation-changed`.

  fix:
    desc: Apply formatters only
    cmds:
      - "{{.GOLANGCI_LINT}} fmt ./..."

  fmt:
    desc: Fail when formatting would change any file
    cmds:
      - "{{.GOLANGCI_LINT}} fmt --diff ./..."

  lint:
    desc: golangci-lint with the repository configuration
    cmds:
      - "{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} {{.GOLANGCI_LINT}} run ./..."

  actions:
    desc: Lint the GitHub Actions workflows
    cmds:
      - go tool actionlint

  arch:
    desc: Architecture tests only (also part of test)
    cmds:
      - go test -race -shuffle=on -count=1 ./internal/arch/...

  hooks:
    desc: Install the local git hooks (commit-msg)
    cmds:
      - git config core.hooksPath .githooks

  nightly-test:
    desc: Repeat every test five times to find flaky ones (nightly)
    cmds:
      - go test -race -shuffle=on -count=5 ./...

  windows-build:
    desc: The module must still build for Windows (nightly)
    env:
      GOOS: windows
    cmds:
      - go build ./...

  warm:
    desc: Build everything the CI builds, to fill the Go build cache
    cmds:
      - go build ./...
      - go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=/dev/null -run '^$' ./...
      - go vet ./...
      - for: [gofumpt, deadcode, govulncheck, go-licenses, gremlins, buf, protoc-gen-go, protoc-gen-connect-go, actionlint, task]
        cmd: go tool -n {{.ITEM}}
      - "{{.GOLANGCI_LINT}} --version"

  vet:
    desc: Custom analyzers of tools/fuguevet through go vet
    cmds:
      - "{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go build -o bin/fuguevet ./tools/fuguevet"
      - "{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go vet -vettool={{.ROOT_DIR}}/bin/fuguevet ./..."

  test:
    desc: All tests with the race detector, shuffled, uncached
    cmds:
      - '{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=cover.out ./...'

  test-pkg:
    desc: Targeted tests with the flags of `task test` (no cover profile)
    # PKG, RUN and COUNT arrive as CLI variables; a declared default would
    # block them, so the fallbacks live in the template instead.
    cmds:
      - '{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go test -race -shuffle=on -count={{if .COUNT}}{{.COUNT}}{{else}}1{{end}}{{if .RUN}} -run {{.RUN | shellQuote}}{{end}} {{if .PKG}}{{.PKG}}{{else}}./...{{end}}'

  coverage:
    desc: Per-package coverage floor and baseline
    cmds:
      - '{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go run ./cmd/fuguegate coverage -profile cover.out -baseline quality/coverage.json'

  deadcode:
    desc: No function unreachable from cmd/* or tests
    cmds:
      - go run ./cmd/fuguegate deadcode ./...

  mod:
    desc: Module hygiene, vulnerabilities and licenses
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go tool govulncheck ./...
      - go tool go-licenses check ./... --allowed_licenses={{.ALLOWED_LICENSES}} --ignore=modernc.org/mathutil

  proto:
    desc: buf lint, format, breaking changes against main, generated code up to date
    cmds:
      - go run ./cmd/fuguegate proto -base origin/main

  generate:
    desc: Regenerate Go and TypeScript code from proto/ (run after changing a .proto file)
    cmds:
      - go tool buf generate proto --template proto/buf.gen.yaml

  fuzz-short:
    desc: 20 seconds per fuzz target
    cmds:
      - '{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go run ./cmd/fuguegate fuzz -time 20s ./...'

  mutation-changed:
    desc: Mutation testing of the guarded packages changed against origin/main
    cmds:
      - '{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go run ./cmd/fuguegate mutation -base origin/main'

  mutation:
    desc: Full mutation testing (nightly)
    cmds:
      - '{{.HEAVY_WRAP}} {{.HEAVY_LOCK}} go run ./cmd/fuguegate mutation -all'
