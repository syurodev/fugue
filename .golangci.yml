# Gate definition: docs/quality-gates.md sections 1-3. Changes need the gate-change-approved label.
# exhaustruct_v5 is the current major version of the exhaustruct linter named in quality-gates §2.
# Every linter enabled here must have a violating fixture under quality/testdata/lint;
# quality/lint_test.go fails when one is missing or does not fire.
version: "2"

run:
  tests: true
  timeout: 10m

issues:
  # One report per linter even when several linters flag the same line, so no gate can hide behind another.
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    # Correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - nilerr
    - nilnil
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - noctx
    - copyloopvar
    - durationcheck
    - makezero
    - reassign
    - recvcheck
    # Errors
    - errorlint
    - err113
    - wrapcheck
    # Enums and structs
    - exhaustive
    - exhaustruct_v5
    # Complexity
    - cyclop
    - gocognit
    - nestif
    - funlen
    - maintidx
    # Junk code
    - unused
    - unparam
    - dupl
    - goconst
    - gocritic
    - unconvert
    - wastedassign
    - prealloc
    - intrange
    - usestdlibvars
    - perfsprint
    # Global state
    - gochecknoglobals
    - gochecknoinits
    # Concurrency
    - containedctx
    - fatcontext
    # Security
    - gosec
    - forbidigo
    # Tests
    - paralleltest
    - tparallel
    - thelper
    - usetesting
    - testableexamples
    # Docs and comments
    - revive
    - godot
    - misspell
    # nolint discipline
    - nolintlint
    # Imports
    - depguard

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
    wrapcheck:
      # Setting ignore-sigs replaces the defaults, so the default signatures
      # are listed explicitly. connect.NewError is the Host API boundary
      # conversion; the client decodes its code and detail (quality-gates §2).
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - connect.NewError(
      # errcode constructors are the repository's way of wrapping, not a boundary leak.
      ignore-package-globs:
        - github.com/syurodev/fugue/internal/platform/errcode
    errcheck:
      check-blank: true
      check-type-assertions: true
    cyclop:
      max-complexity: 12
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    funlen:
      lines: 60
      statements: 40
    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: false
    exhaustruct_v5:
      explicit-mode: true
      enforce-patterns:
        - '.*internal/(kernel|hostapi)(/.*)?\.[A-Za-z0-9_]*(Command|Event|Request)$'
    gocritic:
      enabled-checks:
        - commentedOutCode
        - deferInLoop
        - hugeParam
        - rangeValCopy
    unused:
      exported-fields-are-used: false
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.(Now|Since|Until|Sleep|After|Tick|NewTimer|NewTicker)$'
          msg: use an injected clock.Clock; tests use the fake clock
        - pattern: '^rand\.Read$'
          msg: use the injected ids and randomness ports
        - pattern: '^os\.(Getenv|LookupEnv)$'
          msg: read the environment only in internal/config
        - pattern: '^fmt\.(Print|Printf|Println)$'
          msg: use log/slog with the redacting handler
        - pattern: '^log\..*$'
          msg: use log/slog with the redacting handler
        - pattern: '^(print|println)$'
          msg: use log/slog with the redacting handler
        - pattern: '^panic$'
          msg: return a typed error
        - pattern: '^testing\.(T|B|F|TB)\.(Skip|Skipf|SkipNow)$'
          msg: make the test runnable or delete it; OS-specific tests use build tags
        - pattern: '^testing\.Short$'
          msg: make the test runnable or delete it
        - pattern: '^context\.(Background|TODO)$'
          msg: pass the context in from the caller
    depguard:
      rules:
        banned-modules:
          list-mode: lax
          files:
            - '$all'
          # depguard matches by path prefix, so banning `log` would also ban log/slog.
          allow:
            - log/slog
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests use stdlib testing and go-cmp
            - pkg: github.com/pkg/errors
              desc: use the standard errors package with %w
            - pkg: log
              desc: use log/slog
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog
            - pkg: go.uber.org/zap
              desc: use log/slog
            - pkg: github.com/rs/zerolog
              desc: use log/slog
            - pkg: github.com/golang/glog
              desc: use log/slog
        randomness:
          list-mode: lax
          files:
            - '$all'
            - '!**/internal/platform/ids/**'
            - '!**/internal/crypto/**'
          deny:
            - pkg: math/rand
              desc: use the injected ids and randomness ports
            - pkg: math/rand/v2
              desc: use the injected ids and randomness ports
        kernel-reflection:
          list-mode: lax
          files:
            - '**/internal/kernel/**'
          deny:
            - pkg: reflect
              desc: the kernel uses explicit type switches

  exclusions:
    generated: strict
    presets: []
    rules:
      # The transport returns net listener and connection errors unchanged:
      # http.Server.Serve backs off on a temporary net.Error and detects
      # net.ErrClosed, and wrapping would turn a recoverable accept failure
      # into a fatal exit (F5.1a review, 2026-11-07).
      - path: '^internal/hostapi/listener\.go$'
        linters: [wrapcheck]
      - path: '^internal/platform/clock/'
        linters: [forbidigo]
        text: 'time\.'
      - path: '^internal/(platform/ids|crypto)/'
        linters: [forbidigo]
        text: 'rand\.Read'
      - path: '^internal/config/'
        linters: [forbidigo]
        text: 'os\.(Getenv|LookupEnv)'
      - path: '^cmd/[^/]+/main\.go$'
        linters: [forbidigo]
        text: 'fmt\.Print|log\.|println|context\.(Background|TODO)'
      # forbidigo cannot scope by function name, so the `must*` helpers of quality-gates §3 live in
      # cmd/<name>/must.go and only that file may panic.
      - path: '^cmd/[^/]+/must\.go$'
        linters: [forbidigo]
        text: 'panic'
      - path: '_test\.go$'
        linters: [forbidigo]
        text: 'panic|context\.(Background|TODO)'

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/syurodev/fugue
