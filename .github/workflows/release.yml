# Gate definition: docs/quality-gates.md section 9 (release). Changes need the gate-change-approved label.
# Independent of the PR_TESTS pause and of build.yml: release-check runs the whole suite itself (task check).
# Run by hand on the RC commit (verification section 7): choose the RC tag or commit as the ref.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: release-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task release-check CI_RUN=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Keep the release evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ matrix.os }}
          path: release-evidence.md
          retention-days: 90
