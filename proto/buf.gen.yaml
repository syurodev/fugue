version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/syurodev/fugue/internal/hostapi/internal/pb
plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/hostapi/internal/pb
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: internal/hostapi/internal/pb
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    out: gen/ts
    opt: target=ts
