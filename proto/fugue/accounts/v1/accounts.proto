syntax = "proto3";

package fugue.accounts.v1;

import "fugue/vendors/v1/vendors.proto";

// QuotaWindow is one quota window a vendor reports. utilization is a fraction
// in [0, 1]; resets_at is RFC 3339 and empty when the vendor gave no usable
// reset time.
message QuotaWindow {
  string name = 1;
  double utilization = 2;
  string resets_at = 3;
  // status is "allowed", "allowed_warning", "rejected" or empty when unknown.
  string status = 4;
}

// Account is a vendor's default account (F9.10a: one account per vendor).
// It never carries an identity, a path or credential material.
message Account {
  fugue.vendors.v1.Vendor vendor = 1;
  // state is "ok", "paused" or "needs_login". A paused account whose
  // paused_until has passed is ok again; the host also reports it so.
  string state = 2;
  // paused_until is RFC 3339 and set only while state is "paused".
  string paused_until = 3;
  // login is "unknown", "logged_in" or "logged_out", as the vendor's own CLI
  // last stated it.
  string login = 4;
  // quota_known is false for a vendor with no quota signal: its usage is
  // unknown, never unlimited.
  bool quota_known = 5;
  repeated QuotaWindow windows = 6;
  string updated_at = 7;
  // quota_gate is the host's team quota gate threshold as a fraction in
  // (0, 1]; 0 means no gate applies.
  double quota_gate = 8;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message StartLoginRequest {
  // Vendor is the vendor whose CLI's own login command runs (VR-03). A vendor
  // CLI with no login command answers the typed login.unsupported error.
  fugue.vendors.v1.Vendor vendor = 1;
}

message StartLoginResponse {
  // login_id identifies this attempt in the `login` topic events. The login
  // itself is followed on the topic, never in this RPC: it runs long after
  // the call returns.
  string login_id = 1;
}

message CancelLoginRequest {
  fugue.vendors.v1.Vendor vendor = 1;
}

message CancelLoginResponse {}

message SubmitLoginCodeRequest {
  string command_id = 1;
  string login_id = 2;
  string code = 3;
}

message SubmitLoginCodeResponse {}

// AccountService reports the vendor accounts (F9.10a) and starts the vendor
// CLIs' own login commands (F9.10b). The `quota` topic carries the same
// account shape as JSON: a snapshot {"accounts": [...]} and one event per
// changed account. The `login` topic carries the login progress as JSON: a
// snapshot {"logins": [...]} of the running logins and one event per change,
// with the URL and code the CLI printed relayed verbatim as untrusted data.
service AccountService {
  // ListAccounts refreshes each vendor's login state through the CLI's own
  // status command, then lists the accounts.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // StartLogin runs the vendor CLI's own login command as a supervised
  // process and returns at once; the progress streams on the `login` topic.
  // At most one login per vendor runs at a time. Fugue never opens a browser
  // and never touches vendor credentials.
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  // CancelLogin stops the running login process of one vendor.
  rpc CancelLogin(CancelLoginRequest) returns (CancelLoginResponse);
  // SubmitLoginCode relays a pasted browser code to a running login
  // process's stdin (host-api v0.22 §5.5).
  rpc SubmitLoginCode(SubmitLoginCodeRequest) returns (SubmitLoginCodeResponse);
}
