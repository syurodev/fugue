syntax = "proto3";

package fugue.tasks.v1;

import "google/protobuf/timestamp.proto";

// ChannelLine is one line of a team's channel (host-api §5.3, orchestration
// §6.7). It carries the metadata of the projection and the content opened
// from the sealed source payload; a locked vault never serves content, so
// PageChannel refuses instead. attempt is the retry attempt of the task the
// line's source event names.
message ChannelLine {
  int64 channel_seq = 1;
  string kind = 2;
  string sender_kind = 3;
  string sender_task_id = 4;
  string recipient_task_id = 5;
  string thread_root_task_id = 6;
  uint32 attempt = 7;
  int64 source_seq = 8;
  google.protobuf.Timestamp created_at = 9;
  string content = 10;
}

message PageChannelRequest {
  string team_id = 1;
  string thread_task_id = 2;
  int64 before = 3;
  int64 since = 4;
  uint32 limit = 5;
}

message PageChannelResponse {
  repeated ChannelLine lines = 1;
}

message PostChannelMessageRequest {
  string command_id = 1;
  string team_id = 2;
  string thread_task_id = 3;
  string to_task_id = 4;
  string text = 5;
}

message PostChannelMessageResponse {
  int64 channel_seq = 1;
}

message PruneWorktreesRequest {
  int64 retention_seconds = 1;
}

message PruneWorktreesResponse {
  repeated string removed_worktrees = 1;
  repeated string removed_branches = 2;
  int32 removed_admin_entries = 3;
}

// TeamSummary is the metadata-only summary of one team (host-api v0.19 §5.3,
// INV-09). It is served even while the vault is locked so the sidebar and team
// strip can render badges.
message TeamSummary {
  string team_id = 1;
  string workspace_id = 2;
  string session_id = 3;
  string state = 4;
  string waiting_reason = 5;
  uint32 task_count = 6;
  uint32 running_count = 7;
  uint32 asking_count = 8;
  uint32 failed_count = 9;
  int64 last_seq = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp ended_at = 13;
}

// TeamBudget carries optional team-wide §11 limits.
message TeamBudget {
  uint32 max_agents = 1;
  int64 max_duration_seconds = 2;
}

// TaskNode is one node in a team's task tree (§5.3). When the vault is locked,
// sealed fields (goal, write_scope) are omitted.
message TaskNode {
  string task_id = 1;
  string parent_task_id = 2;
  string retry_of = 3;
  uint32 attempt = 4;
  string hierarchy_role = 5;
  string catalog_role = 6;
  string vendor = 7;
  string model = 8;
  string account_id = 9;
  string state = 10;
  string failure_code = 11;
  string session_id = 12;
  string goal = 13;
  repeated string write_scope = 14;
  repeated string depends_on = 15;
  int64 last_channel_seq = 16;
  int64 elapsed_ms = 17;
}

// TeamView is the full read model of one team (§5.3). When vault_locked is
// true, sealed content (title, brief, goal, write_scope, diff_text) is omitted.
message TeamView {
  TeamSummary summary = 1;
  bool vault_locked = 2;
  string title = 3;
  string brief = 4;
  TeamBudget budget = 5;
  string pending_request_id = 6;
  repeated TaskNode tasks = 7;
  string diff_text = 8;
  bool diff_truncated = 9;
}

message ListTeamsRequest {
  string workspace_id = 1;
  string session_id = 2;
}

message ListTeamsResponse {
  repeated TeamSummary teams = 1;
}

message GetTeamRequest {
  string team_id = 1;
  string diff_task_id = 2;
}

message GetTeamResponse {
  TeamView team = 1;
}

message RecoverTaskRequest {
  string command_id = 1;
  string team_id = 2;
  string task_id = 3;
  string decision = 4;
  string reason = 5;
}

message RecoverTaskResponse {
  TaskNode task = 1;
}

// TaskService serves the team channel, team read model, and unknown-task
// recovery of host-api v0.17/v0.19 §5.3: local principals only — vendor
// session and guard principals never read, post, recover, or subscribe.
// PageChannel without thread_task_id is the general channel; the durable
// topic `team:<id>` streams one event per appended line, with a snapshot of
// the newest 100. PruneWorktrees removes ended-team task worktrees and
// branches past the retention window (orchestration §9).
service TaskService {
  rpc PageChannel(PageChannelRequest) returns (PageChannelResponse);
  rpc PostChannelMessage(PostChannelMessageRequest) returns (PostChannelMessageResponse);
  rpc PruneWorktrees(PruneWorktreesRequest) returns (PruneWorktreesResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  rpc RecoverTask(RecoverTaskRequest) returns (RecoverTaskResponse);
}
