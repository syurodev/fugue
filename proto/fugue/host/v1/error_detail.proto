syntax = "proto3";

package fugue.host.v1;

// ErrorDetail is attached to every Connect error (docs: host-api §4). code is
// the public error code; hidden codes never carry a detail.
message ErrorDetail {
  string code = 1;
  // supported_api_versions is present only when code is unsupported_version:
  // the host's supported versions, ascending, most preferred last. Comparing
  // it with the client's own requirement tells "host older" from "host newer"
  // (docs: cli §2.3).
  repeated string supported_api_versions = 2;
  // retry_after_seconds is present when code is vault.rate_limited.
  int64 retry_after_seconds = 3;
  // current_revision is present when code is appstate.revision_conflict: the
  // revision the stored document carries now, so the caller can retry its CAS
  // against it (host-api §5.2).
  uint64 current_revision = 4;
  // running_sessions, session_limit and session_limit_scope are present when
  // code is vendor.capacity: the sessions counted against the tier that
  // refused the start, that tier's cap, and the tier ("machine" or
  // "account"). Plain numbers and a fixed word; no ids, paths or accounts.
  int64 running_sessions = 5;
  int64 session_limit = 6;
  string session_limit_scope = 7;
}
