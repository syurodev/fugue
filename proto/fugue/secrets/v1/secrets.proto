syntax = "proto3";

package fugue.secrets.v1;

import "google/protobuf/timestamp.proto";

// SecretScopeKind selects whether a secret is global or scoped to a workspace.
enum SecretScopeKind {
  SECRET_SCOPE_KIND_UNSPECIFIED = 0;
  SECRET_SCOPE_KIND_GLOBAL = 1;
  SECRET_SCOPE_KIND_WORKSPACE = 2;
}

// SecretMeta is the unsealed metadata of one stored secret (host-api §5.5).
// Returned by ListSecrets (including while the vault is locked, INV-09) and
// PutSecret; never carries the secret value.
message SecretMeta {
  string secret_id = 1;
  SecretScopeKind scope_kind = 2;
  string scope_id = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ListSecretsRequest {
  SecretScopeKind scope_kind = 1;
  string scope_id = 2;
}

message ListSecretsResponse {
  repeated SecretMeta secrets = 1;
}

message PutSecretRequest {
  string command_id = 1;
  SecretScopeKind scope_kind = 2;
  string scope_id = 3;
  string name = 4;
  string description = 5;
  bytes value = 6;
}

message PutSecretResponse {
  SecretMeta secret = 1;
}

message DeleteSecretRequest {
  string command_id = 1;
  string secret_id = 2;
}

message DeleteSecretResponse {
  bool deleted = 1;
}

// SecretService manages named user secrets (host-api §5.5, F10.15).
// Write-only: there is no GetSecretValue RPC. Only the local principal with
// client kind app may call it.
service SecretService {
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}
